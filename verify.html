gin:0 0 9px}.field input{border:1px solid #dde9f7;border-radius:11px;padding:14px 15px;font-size:13px;width:100%;color:#14233b;outline:none}.field input:focus{border-color:#93c5fd;box-shadow:0 0 0 4px #eff6ff}.footer{font-size:12px;color:#91a4bc;margin-top:25px;line-height:1.7}.extra{margin-top:22px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.extra button{border:0;background:transparent;color:#3b82f6;font-weight:800}.small{font-size:11px;color:#9baac1;margin-top:25px}@media(max-width:480px){.card{padding:37px 24px;border-radius:20px}.card h1{font-size:27px}}

<body><a href="index.html" class="brand inline-flex items-center"><span class="brand-b">✦</span> azure<span style="color:#3b82f6;margin-left:-8px">notes.</span></a>
<main class="card relative"><div class="symbol" id="symbol" aria-hidden="true">✉</div><h1 id="title">Checking your link</h1><p class="sub" id="description">Securely confirming your request with Azure Notes.</p><div id="status" class="status" role="status" aria-live="polite">Connecting…</div>
<form id="reset-form" hidden><div class="field"><label for="new-password">New password</label><input type="password" id="new-password" autocomplete="new-password" placeholder="At least 10 characters" required minlength="10"></div><div class="field"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" autocomplete="new-password" required minlength="10" placeholder="Repeat new password"></div><button class="primary" type="submit" id="reset-btn">Update password</button></form>
<form id="resend-form" hidden><div class="field"><label for="resend-email">Account email address</label><input type="email" id="resend-email" required autocomplete="email" placeholder="you@example.com"></div><button class="primary" type="submit" id="resend-btn">Send verification email</button></form>
<a class="primary" id="login-link" href="index.html" hidden>Continue to sign in</a><div class="extra"><button id="resend-toggle" type="button">Resend verification</button><span style="color:#cbd5e1">·</span><a href="index.html">Back to sign in</a></div></main>
<div class="small">Secure workspace · Azure Notes © 2026</div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),status=$('#status'),title=$('#title'),desc=$('#description');let params=new URLSearchParams(location.hash.slice(1));if(!params.has('token'))params=new URLSearchParams(location.search);const token=params.get('token'),type=params.get('type');if(location.hash)history.replaceState(null,'',location.pathname);
function show(message,error=false){status.hidden=false;status.textContent=message;status.classList.toggle('error',error);}function resetUI(){title.textContent='Create a new password';desc.textContent='Set a new, unique password for your account.';$('#symbol').textContent='♧';$('#reset-form').hidden=false;status.hidden=true;}
async function verify(){if(!token){title.textContent='Link missing or expired';desc.textContent='Request another verification email, or return to sign in.';show('No valid verification token found.',true);return;}
if(type==='reset'){resetUI();return;}title.textContent='Verifying your email';desc.textContent='We are confirming your account.';
try{const res=await AZURE.API.call('verifyEmail',{token},{public:true});title.textContent='Email verified!';desc.textContent='Your knowledge workspace is ready to explore.';$('#symbol').textContent='✓';show(res.message);$('#login-link').hidden=false;$('#resend-toggle').hidden=true;}
catch(e){title.textContent='Verification unsuccessful';desc.textContent='This link may be invalid, already used, or expired.';show(e.message,true);}}
$('#reset-form').addEventListener('submit',async e=>{e.preventDefault();const p=$('#new-password').value,c=$('#confirm-password').value;if(p!==c)return show('The passwords do not match.',true);if(p.length<10)return show('Use at least 10 characters.',true);const b=$('#reset-btn');b.disabled=true;b.textContent='Updating…';try{const r=await AZURE.Auth.reset(token,p);$('#reset-form').hidden=true;title.textContent='Password updated';desc.textContent='You can now sign in with your new password.';$('#symbol').textContent='✓';show(r.message);$('#login-link').hidden=false;}catch(err){show(err.message,true);}finally{b.disabled=false;b.textContent='Update password';}});
$('#resend-toggle').addEventListener('click',()=>{$('#resend-form').hidden=false;$('#reset-form').hidden=true;$('#login-link').hidden=true;title.textContent='Resend verification';desc.textContent='We will send a new link to your inbox.';status.hidden=true;});
$('#resend-form').addEventListener('submit',async e=>{e.preventDefault();const b=$('#resend-btn');b.disabled=true;b.textContent='Sending…';try{const r=await AZURE.API.call('resendVerification',{email:$('#resend-email').value},{public:true});show(r.message);}catch(err){show(err.message,true);}finally{b.disabled=false;b.textContent='Send verification email';}});
document.addEventListener('DOMContentLoaded',verify);
})();</script></body></html>
